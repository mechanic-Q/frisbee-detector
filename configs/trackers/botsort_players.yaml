# BoT-SORT for frisbee player tracking（固定/摇镜边线机位）。
# 与 ultralytics 默认 botsort.yaml 的差异：
#   - gmc_method 保持 sparseOptFlow（实测机位为摇镜，全局运动补偿有效）
#   - track_high_thresh / new_track_thresh 由 worker 按 --conf 动态覆盖写入
#     （默认 botsort.yaml 硬编码 0.25，导致 CLI --conf 失效——2026-09-09 修复）
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 50
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False
