name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check . --ignore E501
      - name: Import test
        run: |
          python -c "from ultralytics import YOLO; print('YOLO import OK')"
          python -c "import cv2; print('OpenCV import OK')"
          python -c "import yaml; print('YAML import OK')"
      - name: Dataset verification (if available)
        run: python tools/verify_dataset.py frisbee.yaml || echo "Dataset not available in CI, skipping"
